[project]
name = "audit-express"
version = "0.1.0"
description = "Rapports d'audit Solidity automatisés (Slither, Foundry, détecteurs maison)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analyse = ["slither-analyzer>=0.10"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
auditx = "auditx.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["auditx"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
